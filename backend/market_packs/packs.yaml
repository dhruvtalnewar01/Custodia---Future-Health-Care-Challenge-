        city: "Abu Dhabi"
        specialties: ["Oncology", "Breast Surgery", "Endocrinology", "Nephrology", "Genomics"]
      - id: "fac-uae-ssmc"
        name: "Sheikh Shakhbout Medical City (SSMC)"
        city: "Abu Dhabi"
        specialties: ["Gastroenterology", "Colorectal Surgery", "Cardiology", "Urology"]
      - id: "fac-uae-bmc"
        name: "Burjeel Medical City"
        city: "Mohamed Bin Zayed City"
        specialties: ["Emergency Medicine", "Nephrology", "Critical Care", "Oncology"]
      - id: "fac-uae-tawam"
        name: "Tawam Hospital Al Ain"
        city: "Al Ain"
        specialties: ["Oncology", "Palliative Care", "Medical Genetics"]
    payer_rules:
      - plan_code: "THIQA"
        payer_name: "Thiqa (National Health Insurance Company - Daman)"
        tier_coverage: 1.00
        copay_amount_aed: 0
        requires_preauth: false
        auto_approve_tiers: ["TIER_1_CRITICAL", "TIER_2_HIGH"]
      - plan_code: "DAMAN_ENHANCED"
        payer_name: "Daman Enhanced Global Network"
        tier_coverage: 0.90
        copay_amount_aed: 50
        requires_preauth: true
        auto_approve_tiers: ["TIER_1_CRITICAL"]
      - plan_code: "ENAYA"
        payer_name: "Enaya Government Health Program"
        tier_coverage: 1.00
        copay_amount_aed: 0
        requires_preauth: false
        auto_approve_tiers: ["TIER_1_CRITICAL", "TIER_2_HIGH"]
    acuity_rules:
      BREAST_BIRADS_4:
        tier: "TIER_2_HIGH"
        sla_hours: 72
        guideline: "DoH Breast Cancer Screening & Diagnostic Pathway 2024"
        rationale: "Suspicious abnormality with 2% to 95% malignancy likelihood requiring urgent tissue diagnosis within 72 hours"
      METABOLIC_HBA1C_RENAL:
        tier: "TIER_2_HIGH"
        sla_hours: 72
        guideline: "DoH IFHAS Comprehensive Metabolic Screening Guidelines"
        rationale: "HbA1c > 9.0% combined with declining eGFR (<60 mL/min) requires nephrology consult within 72 hours"
      COLORECTAL_FIT_POS:
        tier: "TIER_2_HIGH"
        sla_hours: 72
        guideline: "UAE National Colorectal Cancer Screening Standard"
        rationale: "Quantitative FIT positive (>100 ng/mL) requires diagnostic colonoscopy referral within 72 hours"
      ELECTROLYTE_CRITICAL:
        tier: "TIER_1_CRITICAL"
        sla_hours: 24
        guideline: "DoH Emergency Medical Care & Critical Lab Panic Values Protocol"
        rationale: "Serum Potassium > 6.0 mmol/L or < 2.8 mmol/L presents immediate cardiac dysrhythmia hazard: 24h statutory SLA"
      GENOMIC_COUPLE_HBB:
        tier: "TIER_1_CRITICAL"
        sla_hours: 48
        guideline: "UAE National Premarital Screening & Genetic Counseling Mandate"
        rationale: "Dual carrier beta-thalassemia trait status requires urgent genetic counseling prior to marriage certification: 48h SLA"
      UROLOGY_PSA_ELEVATED:
        tier: "TIER_2_HIGH"
        sla_hours: 72
        guideline: "DoH Urological Oncology Diagnostic Standards"
        rationale: "Total PSA > 10.0 ng/mL or age-adjusted PSA elevation requires multiparametric MRI and urology consultation"
    prerequisite_rules:
      BREAST_BIRADS_4:
        - code: "24606-6"
          name: "Diagnostic Mammogram Bilateral with Tomosynthesis"
          mandatory: true
        - code: "24605-8"
          name: "Targeted Breast Ultrasound Report"
          mandatory: true
      METABOLIC_HBA1C_RENAL:
        - code: "4548-4"
          name: "Hemoglobin A1c (HbA1c)"
          mandatory: true
        - code: "33914-3"
          name: "Estimated Glomerular Filtration Rate (eGFR)"
          mandatory: true
        - code: "14959-1"
          name: "Spot Urine Albumin-to-Creatinine Ratio (uACR)"
          mandatory: true
      COLORECTAL_FIT_POS:
        - code: "58453-2"
          name: "Fecal Immunochemical Test (FIT) Quantitative"
          mandatory: true
        - code: "57021-8"
          name: "Complete Blood Count (CBC) with Differential"
          mandatory: true
      ELECTROLYTE_CRITICAL:
        - code: "2823-3"
          name: "Stat Serum Potassium and Electrolyte Panel"
          mandatory: true
        - code: "11524-6"
          name: "12-Lead Electrocardiogram (ECG)"
          mandatory: true
      GENOMIC_COUPLE_HBB:
        - code: "34533-0"
          name: "Hemoglobin Electrophoresis (HbA2 and HbF Quantitation)"
          mandatory: true
        - code: "718-7"
          name: "Complete Blood Count (CBC) Erythrocyte Indices (MCV, MCH)"
          mandatory: true
        - code: "GENOM-PARTNER-ID"
          name: "Documented Partner Premarital National Screening Record"
          mandatory: true
      UROLOGY_PSA_ELEVATED:
        - code: "2857-1"
          name: "Total Prostate-Specific Antigen (PSA)"
          mandatory: true
        - code: "10886-0"
          name: "Free PSA Percentage Ratio"
          mandatory: true
        - code: "24356-8"
          name: "Urinalysis with Microscopic Examination and Culture"
          mandatory: false

